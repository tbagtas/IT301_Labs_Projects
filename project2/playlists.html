<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Not Spotify - Playlists</title>
    <script src="https://kit.fontawesome.com/0c5bdac1be.js" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Monoton&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="stylemain.css">
</head>
<body>
    <nav>
        <div id="nav-left" class="monoton-regular">
            <h1><a href="index.html">Not Spotify</a> <i class="fa-solid fa-compact-disc"></i></h1>
            <form>
                <input type="text" id="search-bar" placeholder="Enter a song or artist">
                <button><i class="fa-solid fa-magnifying-glass"></i></button>
            </form>
        </div>
        <div id="nav-right">
            <a href="playlists.html">My Playlists <i class="fa-solid fa-music"></i></a>
            <a href="artists.html">My Artists <i class="fa-solid fa-face-grin-stars"></i></a>
            <a href="login.html">User <i class="fa-solid fa-user"></i></a>
        </div>
    </nav>

    <div id="page-top">
        <h2 id="playlist-header">Your Playlists</h2>
        <div id="playlist-buttons">
            <button id="new-playlist">New Playlist <i class="fa-solid fa-plus"></i></button>
            <button id="edit-playlist">Edit Playlist <i class="fa-solid fa-pen"></i></button>
            <button id="remove-playlist">Remove Playlist <i class="fa-solid fa-trash"></i></button>
        </div>
    </div>

    <main>
        <ul id="playlist-grid">
        </ul>

        <section id="tracklist" hidden>
            <div id="tracklist-top">
                <h2 id="tracklist-title"></h2>
                <p id="tracklist-count"></p>
            </div>

            <div id="song-buttons">
                <button id="add-song">Add Song <i class="fa-solid fa-plus"></i></button>
                <button id="edit-song">Edit Song <i class="fa-solid fa-pen"></i></button>
                <button id="remove-song">Remove Song <i class="fa-solid fa-trash"></i></button>
            </div>

            <div class="track track-head">
                <span>#</span>
                <span>Title</span>
                <span>Album</span>
                <span>Time</span>
            </div>
            <ul id="track-list">
            </ul>
        </section>
    </main>

    <footer>
        &copy; Trevor Bagtas
    </footer>
</body>
</html>
